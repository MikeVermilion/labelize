[package]
name = "labelize"
version = "0.2.1"
edition = "2021"
description = "Fast Rust engine to parse ZPL & EPL label data and render to PNG/PDF. CLI, HTTP microservice, or library. Open-source Labelary alternative."
keywords = ["zpl", "epl", "label", "barcode", "thermal-printer"]
categories = ["command-line-utilities", "graphics", "parsing", "web-programming"]
repository = "https://github.com/GOODBOY008/labelize"
homepage = "https://github.com/GOODBOY008/labelize"
license = "MIT"
readme = "README.md"
exclude = [
    "testdata/",
    "docs/",
    "examples/",
    "analyze_gd.py",
    ".github/",
    ".qoder/",
    ".kiro/",
    ".idea/",
    "AGENTS.md",
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["native-app", "pdf"]
native-app = ["dep:clap", "dep:axum", "dep:tokio", "dep:serde"]
pdf = ["dep:lopdf"]
wasm-bindings = ["dep:wasm-bindgen"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.26", default-features = false, features = ["text"] }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"], optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
thiserror = "2"
lopdf = { version = "0.40", optional = true }
flate2 = "1"
base64 = "0.22"
datamatrix = "0.3"
qrcode = "0.14"
rxing = { version = "0.8", default-features = false, features = ["encoding_rs"] }
serde = { version = "1", features = ["derive"], optional = true }
wasm-bindgen = { version = "=0.2.117", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
proptest = "1"
reqwest = { version = "0.13", features = ["blocking"] }
sha2 = "0.10"

[[bin]]
name = "labelize"
path = "src/main.rs"
required-features = ["native-app"]
